name: Build Linux ARM64 Binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build portable Linux ARM64 binary
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-musl
          override: true

      - name: Build Linux ARM64 binary
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Archive Linux ARM64 binary
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/elfinstaller dist/
          cd dist && tar czvf elfinstaller-linux-arm64-musl.tar.gz elfinstaller

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elfinstaller-linux-arm64-musl
          path: dist/elfinstaller-linux-arm64-musl.tar.gz
