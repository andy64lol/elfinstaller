name: Build ARM64 Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu
          override: true

      - name: Build for ARM64
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Create ARM64 Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/elfinstaller dist/
          cd dist && tar czvf elfinstaller-arm64.tar.gz elfinstaller

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elfinstaller-arm64-package
          path: dist/elfinstaller-arm64.tar.gz
