name: Build AMD64 Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build AMD64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          override: true

      - name: Build for AMD64
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Create AMD64 Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/elfinstaller dist/
          cd dist && tar czvf elfinstaller-amd64.tar.gz elfinstaller

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elfinstaller-amd64-package
          path: dist/elfinstaller-amd64.tar.gz
