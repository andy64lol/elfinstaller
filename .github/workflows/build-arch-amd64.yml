name: Build Arch Linux x86_64 Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Arch Linux x86_64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build pacman package in Arch Linux
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel rust
              useradd --create-home builder
              chown -R builder:builder /workspace
              runuser -u builder -- make arch-package
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: elfinstaller-arch-x86_64
          path: dist/*.pkg.tar.zst
